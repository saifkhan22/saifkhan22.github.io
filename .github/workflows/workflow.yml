name: Deploy to Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Process
        env:
          AACB25: ${{ secrets.AACB25 }}
          B5D757: ${{ secrets.B5D757 }}
        run: |
          python3 -c "
          import os, sys, pathlib
          a, b = os.environ.get('AACB25', ''), os.environ.get('B5D757', '')
          html = pathlib.Path('index.html')
          text = html.read_text(encoding='utf-8')
          patched = text
          if a:
              patched = patched.replace('<!-- a459332cb2761fd70d4263f4c014850ab10be84fd874d765 -->', a)
          if b:
              patched = patched.replace('<!-- 1b79a26c77dc77b1b9374aa676963e40 -->', b)
          if patched == text and (a or b):
              sys.exit(1)
          if patched != text:
              html.write_text(patched, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
